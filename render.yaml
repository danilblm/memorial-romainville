# Mise en ligne du serveur (API) sur Render, offre gratuite.
# Render lit ce fichier (« Blueprint ») et crée le service tout seul.
services:
  - type: web
    name: memorial-romainville-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Adresse de la base MongoDB Atlas (à coller dans Render, jamais sur GitHub)
      - key: DATABASE_URL
        sync: false
      # Clé de sécurité des connexions : Render la génère lui-même
      - key: JWT_SECRET
        generateValue: true
      # Adresse du site sur Vercel (ex. https://memorial-romainville.vercel.app)
      - key: CLIENT_URL
        sync: false
      # Compte admin créé au premier démarrage
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
